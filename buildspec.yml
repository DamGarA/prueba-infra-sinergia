version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "=== Instalando dependencias del proyecto ==="
      - cd modules/frontend
      - npm install

  pre_build:
    commands:
      - echo "=== Verificando entorno ==="
      - node -v
      - npm -v

  build:
    commands:
      - echo "=== Iniciando build de Electron para Windows (.exe) ==="
      - npm run build:win
      - if ($LASTEXITCODE -ne 0) { echo "❌ Error en build de Electron"; exit 1 }

  post_build:
    commands:
      - echo "=== Contenido de dist ==="
      - dir dist
      - echo "=== Subiendo artefactos a S3 ==="
      - aws s3 cp dist s3://prueba-sinergia/ --recursive --exclude "*.map"

artifacts:
  files:
    - modules/frontend/dist/**/*
