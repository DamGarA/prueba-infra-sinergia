version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Instalando dependencias del sistema..."
      - apt-get update
      - apt-get install -y --no-install-recommends wine64 xvfb
      - npm install -g yarn
      - yarn install
  pre_build:
    commands:
      - echo "Preparando build de Electron..."
  build:
    commands:
      - echo "Iniciando build de Electron para Windows (.exe)..."
      - yarn electron:package --win nsis
  post_build:
    commands:
      - echo "Subiendo artefactos a S3..."
      - aws s3 cp dist/ s3://prueba-electron-sinergia/ --recursive

artifacts:
  files:
    - dist/**/*
