version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "=== Instalando dependencias del sistema ==="
      - apt-get update
      - apt-get install -y --no-install-recommends wine64 xvfb zip unzip ca-certificates
      - dpkg --add-architecture i386
      - apt-get update
      - apt-get install -y wine32
      - npm install -g yarn
      - yarn install
  pre_build:
    commands:
      - echo "=== Preparando entorno de Electron ==="
      - echo "Node version:" && node -v
      - echo "Yarn version:" && yarn -v
      - echo "Electron version:" && yarn electron --version || true
  build:
    commands:
      - echo "=== Iniciando build de Electron para Windows (.exe) ==="
      - xvfb-run -a yarn electron:package --win nsis --publish never || (echo "❌ Error en electron-builder" && exit 1)
  post_build:
    commands:
      - echo "=== Subiendo artefactos a S3 ==="
      - aws s3 cp dist/ s3://prueba-electron-sinergia/ --recursive

artifacts:
  files:
    - dist/**/*
